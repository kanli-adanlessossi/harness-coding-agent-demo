name: Agent evals

# Runs the real coding agent against the eval tasks, once with the baseline from
# the target branch and once with the baseline from this PR, then compares:
# "Did this change make the agent better, or only different?"
#
# Requires the repository secret ANTHROPIC_API_KEY.

on:
  pull_request:
    paths:
      - "agent-baseline/**"
      - "mcp_server/**"
      - "evals/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to evaluate (empty = CLI default)"
        required: false
      repeat:
        description: "Attempts per task"
        default: "3"

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    # Never expose the API key to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REPEAT: ${{ inputs.repeat || '3' }}
      MODEL_ARG: ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the baseline we compare against
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code

      - name: Evaluate base baseline
        run: python evals/run_evals.py --agent claude --baseline base/agent-baseline --repeat "$REPEAT" $MODEL_ARG --out results/base.json
      - name: Evaluate this branch's baseline
        run: python evals/run_evals.py --agent claude --baseline agent-baseline --repeat "$REPEAT" $MODEL_ARG --out results/head.json
      - name: Compare
        run: python evals/compare.py results/base.json results/head.json --md "$GITHUB_STEP_SUMMARY" --fail-on-regression

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
